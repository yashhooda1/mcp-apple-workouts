[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "apple-workouts-mcp"
version = "0.1.0"
description = "MCP server that builds structured workouts and training plans for Apple Watch (WorkoutKit) via the HoodaRun app."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10"
authors = [{ name = "Yash Hooda" }]
keywords = ["mcp", "apple-watch", "workoutkit", "running", "training", "claude"]
dependencies = [
    "mcp>=1.2,<2",
    "pydantic>=2.0",
    "httpx>=0.27",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "ruff>=0.6,<0.17"]

[project.scripts]
apple-workouts-mcp = "apple_workouts_mcp.server:main"
apple-workouts-strava-auth = "apple_workouts_mcp.strava:interactive_auth"

[project.urls]
Homepage = "https://github.com/yashhooda1/mcp-apple-workouts"

[tool.hatch.build.targets.wheel]
packages = ["src/apple_workouts_mcp", "plans"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]

[tool.pytest.ini_options]
pythonpath = ["src", "."]
testpaths = ["tests"]
