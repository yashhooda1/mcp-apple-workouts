[build]
builder = "DOCKERFILE"

[deploy]
startCommand = "apple-workouts-mcp"
restartPolicyType = "ON_FAILURE"
# A new deploy only takes traffic once it answers here, so a build that starts
# but can't be reached is marked failed instead of "successful" with 502s.
healthcheckPath = "/healthz"
healthcheckTimeout = 60

# The app listens on $PORT (the Dockerfile's default is 8000). In the service's
# Settings > Networking, the public domain's target port must be that same
# port; if they differ every request returns "Application failed to respond".

# Set in Railway dashboard (Variables), and attach a volume at /data:
#   MCP_AUTH_TOKEN=<openssl rand -hex 32>    (required — gates /mcp, /feed.json, /status)
#   PUBLIC_BASE_URL=https://<your-app>.up.railway.app   (enables OAuth for Claude/ChatGPT)
#   OAUTH_OWNER_PASSWORD=<long passphrase>  (optional — connector sign-in; default MCP_AUTH_TOKEN)
#   CALENDAR_TOKEN=<openssl rand -hex 24>   (optional — enables /calendar/<token>.ics)
#   SIGNUP_INVITE_CODE=<a code you share>   (optional — invite-only accounts, docs/accounts.md)
#   APPLE_CLIENT_ID / APPLE_TEAM_ID / APPLE_KEY_ID / APPLE_PRIVATE_KEY
#                                           (optional — Sign in with Apple)
#   STRAVA_CLIENT_ID / STRAVA_CLIENT_SECRET  (optional, for history)
# Run `apple-workouts-strava-auth` locally, then upload strava_tokens.json to /data.
